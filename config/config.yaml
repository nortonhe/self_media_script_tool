server:
  path: "/test"
  port: 9123
llm:
  apiKey: "ollama" # 如果需要 API Key，请在此处填写
  baseURL: "http://127.0.0.1:11434/v1"
prompt:
  baseDir: "./config/prompt" # prompt 模板文件存放目录
  hotReload: true # 热加载总开关，true开启，false关闭
  uses:
    - templateID: "short_video_sales"
      version: "v1"
log:
  level: debug # 日志级别，可选值为 debug、info、warn、error
  file: "./logs/app.log"  # 日志文件路径
  maxSize: 100 # 日志文件最大大小，单位为 MB
  maxBackups: 10 # 日志文件最大备份数量
  maxAge: 7 # 日志文件最大保存天数
  compress: true # 是否压缩日志文件
  console: false # false=关闭控制台输出
otel:
  serviceName: "self_media_script_tool" # 服务名称
  endpoint: "127.0.0.1:4318" # OTLP endpoint
  samplingRate: 1.0 # 采样率，范围为 0.0 到 1.0
  metricsInterval: 10 # 指标采集间隔，单位为秒